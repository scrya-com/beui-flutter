name: beui_gallery
description: Gallery of beUI Flutter widgets. Every previewKey from the React catalog.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  beui:
    path: ../../packages/beui
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/beui-mark.png
