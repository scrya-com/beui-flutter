<!DOCTYPE html>
<html lang="en" class="dark" style="background:#151515;color-scheme:dark">
<head>

    If you are serving your web app in a path other than the root, change the

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Animated Flutter widgets ported from beui.dev. Same springs, same catalog, running on iOS, Android, and the web.">
  <meta name="theme-color" content="#151515">
  <link rel="canonical" href="https://scrya-com.github.io/beui-flutter/">

  <!-- Open Graph / Reddit / Slack / iMessage -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="beUI">
  <meta property="og:title" content="beUI for Flutter">
  <meta property="og:description" content="Animated Flutter widgets ported from beui.dev. Same springs, same catalog, running on iOS, Android, and the web.">
  <meta property="og:url" content="https://scrya-com.github.io/beui-flutter/">
  <meta property="og:image" content="https://scrya-com.github.io/beui-flutter/og.jpg">
  <meta property="og:image:secure_url" content="https://scrya-com.github.io/beui-flutter/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="beUI — animated Flutter widgets">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="beUI for Flutter">
  <meta name="twitter:description" content="Animated Flutter widgets ported from beui.dev. Same springs, same catalog, running on iOS, Android, and the web.">
  <meta name="twitter:image" content="https://scrya-com.github.io/beui-flutter/og.jpg">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="beUI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>beUI for Flutter</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--

    or to give the user feedback during the initialization process.
